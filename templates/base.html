<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- =========================================================
         PRIMARY SEO
    ========================================================= -->

    <title>
        {% block title %}CodeHype Tech{% endblock %}
    </title>


    <meta
        name="author"
        content="Priyanshu Kumar"
    >


    <meta
        name="robots"
        content="index, follow, max-image-preview:large"
    >


    {% block extra_head %}
    {% endblock %}



    <!-- =========================================================
         FAVICON
    ========================================================= -->

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/codehype-logo.png') }}"
    >



    <!-- =========================================================
         BOOTSTRAP ICONS
    ========================================================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >



    <!-- =========================================================
         BOOTSTRAP
    ========================================================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >



    <!-- =========================================================
         MAIN CSS
    ========================================================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">


        <!-- =====================================================
             LOGO
        ====================================================== -->

        <a
            class="navbar-brand codehype-brand"
            href="{{ url_for('home') }}"
            aria-label="CodeHype Tech Home"
        >

            <img
                src="{{ url_for('static', filename='images/codehype-logo.png') }}"
                alt="CodeHype Tech Logo"
                class="codehype-logo"
            >

        </a>



        <!-- =====================================================
             MOBILE MENU BUTTON
        ====================================================== -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >

            <span class="navbar-toggler-icon"></span>

        </button>



        <!-- =====================================================
             NAVIGATION
        ====================================================== -->

        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-auto">


                <!-- =================================================
                     HOME
                ================================================== -->

                <li class="nav-item">

                    <a
                        class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
                        href="{{ url_for('home') }}"
                    >
                        Home
                    </a>

                </li>



                <!-- =================================================
                     ABOUT
                ================================================== -->

                <li class="nav-item">

                    <a
                        class="nav-link {% if request.endpoint == 'about' %}active{% endif %}"
                        href="{{ url_for('about') }}"
                    >
                        About
                    </a>

                </li>



                <!-- =================================================
                     CODEHYPE TECH
                ================================================== -->

                <li class="nav-item">

                    <a
                        class="nav-link {% if request.endpoint == 'codehype' %}active{% endif %}"
                        href="{{ url_for('codehype') }}"
                    >
                        CodeHype Tech
                    </a>

                </li>



                <!-- =================================================
                     CODEHYPE TECH LABS
                ================================================== -->

                <li class="nav-item">

                    <a
                        class="nav-link {% if request.endpoint == 'labs' or request.endpoint == 'tutorial' %}active{% endif %}"
                        href="{{ url_for('labs') }}"
                    >
                        CodeHype Tech Labs
                    </a>

                </li>



                <!-- =================================================
                     PROJECTS
                ================================================== -->

                <li class="nav-item">

                    <a
                        class="nav-link {% if request.endpoint == 'projects' %}active{% endif %}"
                        href="{{ url_for('projects') }}"
                    >
                        Projects
                    </a>

                </li>


            </ul>

        </div>

    </div>

</nav>



<!-- =========================================================
     MAIN CONTENT
========================================================= -->

{% block content %}

{% endblock %}



<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="simple-footer">

    <div class="container">

        <span>
            © 2026 CodeHype Tech · Priyanshu Kumar
        </span>

    </div>

</footer>



<!-- =========================================================
     BOOTSTRAP JS
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
